# 1. Säg till Spring att starta en H2-databas i minnet (mem) som heter testdb
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
# 2. Använd H2-drivrutinen istället för MySQL/PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
# 3. Användaruppgifter (Du kan skriva vad som helst här, H2 accepterar det)
spring.datasource.username=admin
spring.datasource.password=admin123
# 4. Säg till Hibernate att prata "H2-språk" men simulera MySQL-syntax
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 5. Låt Hibernate skapa tabellerna automatiskt utifrån dina @Entity-klasser (t.ex. UserModel)
# Detta gör att du slipper konfigurera Flyway eller köra SQL-skript för testerna!
spring.jpa.hibernate.ddl-auto=create-drop
# 6. (Valfritt) Visa SQL-frågorna i terminalen när testerna körs ? perfekt för felsökning
spring.jpa.show-sql=true